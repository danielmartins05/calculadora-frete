<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de etiquetas — JL Produtos Naturais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #74BE33;
    --verde-escuro: #4C8A1E;
    --verde-claro: #EEF7E2;
    --preto: #161616;
    --cinza-texto: #5C5C5C;
    --cinza-borda: #E1E5DC;
    --fundo: #F7F9F4;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    margin: 0;
    background: var(--fundo);
    color: #1C231E;
  }

  .pagina {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  .logo-bolha {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--verde);
    color: var(--preto);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    color: var(--preto);
  }

  header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--cinza-texto);
  }

  .painel {
    background: #fff;
    border: 1px solid var(--cinza-borda);
    border-radius: 14px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: 0 1px 3px rgba(30, 58, 40, 0.04);
  }

  button {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    padding: 11px 20px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:active { transform: scale(0.98); }

  #btnBuscar {
    background: var(--verde);
    color: #fff;
  }
  #btnBuscar:hover:not(:disabled) { background: var(--verde-escuro); }
  #btnBuscar:disabled { background: #A7B4AC; cursor: default; }

  #btnImprimir {
    background: #fff;
    color: var(--verde-escuro);
    border: 1.5px solid var(--verde);
  }
  #btnImprimir:hover { background: var(--verde-claro); }

  #status {
    font-size: 13.5px;
    color: var(--cinza-texto);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ponto-carregando {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--verde);
    display: inline-block;
    animation: pulsar 1s infinite ease-in-out;
  }
  @keyframes pulsar {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .vazio {
    margin-top: 24px;
    padding: 28px;
    text-align: center;
    color: var(--cinza-texto);
    font-size: 14px;
    background: #fff;
    border: 1px dashed var(--cinza-borda);
    border-radius: 14px;
  }

  #area-grade {
    margin-top: 24px;
  }

  #area-grade:not(:empty) {
    background: #fff;
    border: 1px solid var(--cinza-borda);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(30, 58, 40, 0.04);
  }

  #grade {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .celula {
    border: 1px solid #000;
    padding: 5px 6px;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-size: 8pt;
    line-height: 1.3;
    border-radius: 2px;
  }

  .cabecalho { font-weight: bold; margin-bottom: 1px; }
  .ref { color: #888; margin: 2px 0; font-size: 7pt; }
  .divisor { border-top: 1px dashed #999; margin: 3px 0; }
  .rotulo-declaracao { font-size: 7pt; color: #777; margin-bottom: 1px; }
  .itens { margin-top: 2px; }

  @media print {
    body { background: #fff; margin: 0; }
    .pagina { max-width: none; padding: 0; }
    header, .painel, #status { display: none; }
    #area-grade { border: none; box-shadow: none; padding: 0; border-radius: 0; }
    #grade { gap: 0; }
    .celula { border: 1px solid #000; border-radius: 0; }
  }
</style>
</head>
<body>

<div class="pagina">

  <header>
    <div class="logo-bolha">JL</div>
    <div>
      <h1>Gerador de etiquetas</h1>
      <p>Pedidos pagos e ainda não despachados, prontos pra imprimir e recortar</p>
    </div>
  </header>

  <div class="painel">
    <button id="btnBuscar" onclick="buscarPedidos()">Buscar pedidos pendentes</button>
    <button id="btnImprimir" onclick="window.print()" style="display:none;">Imprimir</button>
    <span id="status"></span>
  </div>

  <div id="area-grade">
    <div id="grade"></div>
  </div>

</div>

<script>
  var FUNCTION_URL = 'https://calculadorajl-frete.netlify.app/.netlify/functions/listar-pedidos-etiquetas';

  function celulaHtml(pedido, seq, lote) {
    var linha2 = pedido.endereco2 ? (pedido.endereco2 + '<br>') : '';
    var itensHtml = (pedido.itens || [])
      .map(function (it) { return it.quantidade + 'x ' + it.titulo; })
      .join('<br>');
    return '' +
      '<div class="celula">' +
        '<div class="cabecalho">DESTINATÁRIO #' + seq + '&nbsp;&nbsp;' + pedido.servico + '</div>' +
        pedido.nome + '<br>' +
        pedido.endereco1 + '<br>' +
        linha2 +
        pedido.cidade + ' - ' + pedido.estado + '<br>' +
        'CEP: ' + pedido.cep +
        '<div class="ref">' + seq + '-' + lote + '</div>' +
        '<div class="divisor"></div>' +
        '<div class="rotulo-declaracao">Declaração de conteúdo</div>' +
        pedido.nome + '<br>' +
        pedido.endereco1 + '<br>' +
        linha2 +
        pedido.cidade + ' - ' + pedido.estado + '<br>' +
        'CEP: ' + pedido.cep +
        '<div class="itens">' + itensHtml + '</div>' +
      '</div>';
  }

  function buscarPedidos() {
    var status = document.getElementById('status');
    var btn = document.getElementById('btnBuscar');
    var grade = document.getElementById('grade');
    btn.disabled = true;
    document.getElementById('btnImprimir').style.display = 'none';
    status.innerHTML = '<span class="ponto-carregando"></span> Buscando pedidos...';
    grade.innerHTML = '';

    fetch(FUNCTION_URL)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        if (data.error) {
          status.textContent = 'Erro: ' + data.error;
          return;
        }
        var pedidos = data.pedidos || [];
        if (pedidos.length === 0) {
          status.textContent = '';
          grade.innerHTML = '';
          document.getElementById('area-grade').innerHTML =
            '<div class="vazio">Nenhuma etiqueta a ser impressa no momento.</div>';
          return;
        }
        var lote = new Date().toISOString().slice(5, 10).replace('-', '');
        var html = pedidos.map(function (p, i) { return celulaHtml(p, i + 1, lote); }).join('');
        grade.innerHTML = html;
        status.textContent = pedidos.length + ' pedido(s) encontrado(s).';
        document.getElementById('btnImprimir').style.display = 'inline-block';
      })
      .catch(function (err) {
        btn.disabled = false;
        status.textContent = 'Erro ao buscar: ' + err.message;
      });
  }
</script>

</body>
</html>
